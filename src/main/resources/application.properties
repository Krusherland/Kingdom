spring.application.name=Kingdom

# --- Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/kingdom_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- WebSocket ---
spring.websocket.max-text-message-size=131072

# --- Game Rules ---
game.min-players=6
game.max-players=8
game.total-rounds=3
game.draw-time-seconds=60
